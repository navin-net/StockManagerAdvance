services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockmanager_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stockmanager

  nginx:
    image: nginx:alpine
    container_name: stockmanager_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - stockmanager

  mysql:
    image: mysql:8.0
    container_name: stockmanager_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockmanager
      MYSQL_ROOT_PASSWORD: 1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - stockmanager

networks:
  stockmanager:

volumes:
  mysql_data: