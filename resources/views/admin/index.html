<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Scheduler - Task Assignment</title>

<!-- Bootstrap 5.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>
  body { background: #f8f9fa; padding: 20px; }
  #calendar { background: #fff; border-radius: 0.5rem; padding: 1rem; }
  .end-line { position: absolute; height: 2px; background-color: red; width: 100%; top: 100%; left: 0; }
</style>
</head>
<body>

<div class="container">
  <h3 class="fw-bold mb-4 text-center">📚 Study Scheduler - Assign Tasks</h3>

  <!-- Add Task Form -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white fw-bold">Add New Study Task</div>
    <div class="card-body">
      <form id="taskForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Subject</label>
          <select id="subject" class="form-select" required>
            <option value="">Choose...</option>
            <option value="PHP">PHP</option>
            <option value="Java">Java</option>
            <option value="HTML/CSS">HTML/CSS</option>
            <option value="JavaScript">JavaScript</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input type="date" id="date" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Start Time</label>
          <input type="time" id="start" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">End Time</label>
          <input type="time" id="end" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Note</label>
          <textarea id="note" class="form-control" rows="2" placeholder="Brief note about this session"></textarea>
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-success">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Calendar -->
  <div id="calendar"></div>

  <!-- Task Table -->
  <div class="card mt-4">
    <div class="card-header bg-secondary text-white fw-bold">Task List</div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0" id="taskTable">
        <thead class="table-dark">
          <tr>
            <th>Subject</th>
            <th>Date</th>
            <th>Time</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal for Day Details -->
<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Study Sessions</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="dayModalBody"></div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const taskForm = document.getElementById('taskForm');
  const tableBody = document.querySelector('#taskTable tbody');

  let tasks = [];

  // Initialize Calendar
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
    events: tasks,
    eventDidMount: function(info) {
      // red end line
      const endLine = document.createElement('div');
      endLine.classList.add('end-line');
      info.el.appendChild(endLine);
    },
    dateClick: function(info) {
      const selected = tasks.filter(ev => ev.start.startsWith(info.dateStr));
      if (selected.length === 0) {
        document.getElementById('dayModalBody').innerHTML = `<p>No tasks for this date.</p>`;
      } else {
        let html = '<ul class="list-group">';
        selected.forEach(ev => {
          html += `<li class="list-group-item">
                    <strong>${ev.title}</strong><br>
                    ${new Date(ev.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
                    - ${new Date(ev.end).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}<br>
                    ${ev.extendedProps.note}
                   </li>`;
        });
        html += '</ul>';
        document.getElementById('dayModalBody').innerHTML = html;
      }
      new bootstrap.Modal('#dayModal').show();
    }
  });

  calendar.render();

  // Add Task Handler
  taskForm.addEventListener('submit', e => {
    e.preventDefault();
    const subject = subject.value;
    const date = document.getElementById('date').value;
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const note = document.getElementById('note').value;

    const startTime = `${date}T${start}`;
    const endTime = `${date}T${end}`;

    const newTask = { title: subject, start: startTime, end: endTime, extendedProps: { note } };
    tasks.push(newTask);

    // Add to table
    const row = `<tr>
                   <td>${subject}</td>
                   <td>${date}</td>
                   <td>${start} - ${end}</td>
                   <td>${note}</td>
                 </tr>`;
    tableBody.insertAdjacentHTML('beforeend', row);

    // Add to calendar
    calendar.addEvent(newTask);

    // Reset form
    taskForm.reset();
  });
});
</script>
</body>
</html>
