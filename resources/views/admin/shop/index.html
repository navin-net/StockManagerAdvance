<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banner / Slider Management</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .banner-card {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
        }
        .banner-image {
            max-height: 120px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Banner / Slider Management</h5>
        </div>

        <div class="card-body">

            <!-- Banner Item -->
            <div class="banner-card">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" placeholder="Banner title">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Link URL</label>
                        <input type="url" class="form-control" placeholder="https://example.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Image</label>
                        <input type="file" class="form-control image-input" accept="image/*">
                        <img class="banner-image">
                    </div>

                    <div class="col-md-6 d-flex align-items-center">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Add Banner Button -->
            <div class="text-end">
                <button class="btn btn-outline-primary" id="addBanner">
                    <i class="bi bi-plus-circle"></i> Add Banner
                </button>
            </div>

        </div>

        <div class="card-footer text-end bg-white">
            <button class="btn btn-primary">
                <i class="bi bi-save"></i> Save Changes
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Image preview
    document.addEventListener('change', function (e) {
        if (e.target.classList.contains('image-input')) {
            const img = e.target.nextElementSibling;
            const file = e.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }
    });

    // Add new banner UI
    document.getElementById('addBanner').addEventListener('click', function () {
        const container = document.querySelector('.card-body');

        const banner = document.createElement('div');
        banner.className = 'banner-card';
        banner.innerHTML = `
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" placeholder="Banner title">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Link URL</label>
                    <input type="url" class="form-control" placeholder="https://example.com">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Image</label>
                    <input type="file" class="form-control image-input" accept="image/*">
                    <img class="banner-image">
                </div>

                <div class="col-md-6 d-flex align-items-center">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input" type="checkbox" checked>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
        `;

        container.insertBefore(banner, container.lastElementChild);
    });
</script>

</body>
</html>
