<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --header-height: 60px;
            --primary-color: #0ea5e9;
            --transition-speed: 0.3s;
        }
        [data-bs-theme="light"] {
            --bg-color: #ffffff;
            --sidebar-bg: #f8fafc;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: rgba(0,0,0,0.1);
            --text-color: #1e293b;
            --text-muted: #64748b;
        }
        [data-bs-theme="dark"] {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --header-bg: #020617;
            --card-bg: #1e293b;
            --border-color: rgba(255,255,255,0.1);
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }
        .app-header {
            height: var(--header-height);
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            transition: background-color var(--transition-speed);
        }
        .sidebar {
            width: var(--sidebar-width);
            position: fixed;
            top: var(--header-height);
            left: 0;
            bottom: 0;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform var(--transition-speed);
            z-index: 1020;
        }
        .sidebar-visible .sidebar {
            transform: translateX(0);
        }
        .main-content {
            margin-top: var(--header-height);
            margin-left: 0;
            padding: 1.5rem;
            flex: 1;
            transition: margin-left var(--transition-speed);
        }
        .sidebar-visible .main-content {
            margin-left: var(--sidebar-width);
        }
        .nav-link {
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            display: block;
            margin-bottom: 5px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background-color: rgba(14,165,233,0.1);
            color: var(--primary-color);
        }
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 1015;
        }
        .sidebar-visible .sidebar-overlay {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary me-2" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="h5 mb-0">Dashboard</h1>
        </div>

        <!-- Theme Dropdown -->
        <div class="dropdown ms-3">
            <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center" 
                type="button" id="themeDropdownButton" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-moon-stars me-2"></i>
                <span id="currentThemeLabel">Dark</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item d-flex align-items-center" href="#" data-theme="dark">
                        <i class="bi bi-moon-stars me-2"></i> Dark
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center" href="#" data-theme="light">
                        <i class="bi bi-sun me-2"></i> Light
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center" href="#" data-theme="system">
                        <i class="bi bi-circle-half me-2"></i> System
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="nav flex-column p-3">
            <a class="nav-link" href="#">Dashboard</a>
            <a class="nav-link" href="#">Users</a>
            <a class="nav-link" href="#">Settings</a>
        </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <h2>Welcome to the Dashboard</h2>
        <p>This is a full working example with theme dropdown and sidebar.</p>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;
            const body = document.body;
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.querySelector('.sidebar-overlay');
            const themeDropdownItems = document.querySelectorAll('.dropdown-item[data-theme]');
            const currentThemeLabel = document.getElementById('currentThemeLabel');

            // --- Theme Function ---
            function setTheme(theme) {
                if (theme === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    html.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');
                } else {
                    html.setAttribute('data-bs-theme', theme);
                }
                localStorage.setItem('theme', theme);
                if (currentThemeLabel) {
                    currentThemeLabel.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
                }
            }

            // Load saved theme
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);

            // Theme Dropdown click
            themeDropdownItems.forEach(item => {
                item.addEventListener('click', e => {
                    e.preventDefault();
                    const selectedTheme = item.getAttribute('data-theme');
                    setTheme(selectedTheme);
                });
            });

            // --- Sidebar State Persistence ---
            const savedSidebarState = localStorage.getItem('sidebar-visible');
            if (savedSidebarState === 'true') body.classList.add('sidebar-visible');

            sidebarToggle?.addEventListener('click', () => {
                const isVisible = body.classList.toggle('sidebar-visible');
                localStorage.setItem('sidebar-visible', isVisible);
            });

            sidebarOverlay?.addEventListener('click', () => {
                body.classList.remove('sidebar-visible');
                localStorage.setItem('sidebar-visible', false);
            });
        });
    </script>
</body>
</html>
